project_id = "fvjganetpyyrguuxjtqi"
[functions.create-preview-log]
enabled = true
verify_jwt = true
import_map = "./functions/create-preview-log/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/create-preview-log/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/create-preview-log/*.html" ]

# Isolated-branch only. Stripe cannot send a user JWT.
# Do NOT apply this verify_jwt=false change to production from this PR.
# Production JWT policy is a separate founder-approved change.
[functions.stripe-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/stripe-webhook/index.ts"
